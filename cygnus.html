<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus X-1 — Black Hole Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="/cygnus.css">
<style>
#galaxy-phase{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:#000;opacity:1;transition:opacity 0.6s;pointer-events:all}
#galaxy-phase.hidden{opacity:0;pointer-events:none;z-index:-1}
#galaxy-img{max-width:90vw;max-height:90vh;cursor:pointer;filter:drop-shadow(0 0 20px rgba(74,168,255,0.3));
  transition:filter 0.3s}
#galaxy-img:hover{filter:drop-shadow(0 0 40px rgba(74,168,255,0.6))}
#warp-canvas{position:fixed;inset:0;z-index:11;display:none}
#star-phase{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(15,5,30,0.7) 0%,#000 100%)}
#star-phase.active{display:flex}
#star-container{position:relative;width:320px;height:320px;z-index:13;pointer-events:none}
#star-img{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 30px rgba(255,180,100,0.8))}
</style>
</head>
<body>

<div id="signal-decode">
  <div id="sd-inner">
    <div id="sd-freq">88.7 FM — CYGNUS X-1 // TRANSMISSION RECEIVED // 2011-03-14</div>
    <div id="sd-line"><span id="sd-text"></span><span id="sd-cursor"></span></div>
    <div id="sd-source">— origin: CYGNUS X-1 / 6,070 LY / decoded NODE 09 archive</div>
  </div>
</div>

<div id="intro">
  <div id="intro-inner">
    <div id="intro-text">Cygnus X-1</div>
    <div id="intro-line"></div>
    <div id="intro-sub">WNCORE Black Hole Archive — Signal Terminus</div>
  </div>
</div>

<canvas id="canvas"></canvas>
<div id="grain"></div>
<div id="scanlines"></div>
<div id="glitch-canvas"></div>
<div class="glitch-bar" id="glitch-bar1" style="top:22%"></div>
<div class="glitch-bar" id="glitch-bar2" style="top:55%"></div>
<div class="glitch-bar" id="glitch-bar3" style="top:78%"></div>
<div id="static-overlay"></div>

<div id="galaxy-phase">
  <img id="galaxy-img" src="/assets/Cygnus-gifs/galaxy/GalaxyArantus.gif" alt="Galaxy Arantus">
</div>

<canvas id="warp-canvas"></canvas>

<div id="star-phase">
  <div id="star-container">
    <img id="star-img" src="/assets/Cygnus-gifs/galaxy/StarNivora.gif" alt="Star Nivora">
  </div>
</div>

<header id="hd">
  <div id="hd-left">
    <a href="/" id="hd-logo">WNCORE</a>
    <span id="hd-sep"></span>
    <span id="hd-title">Cygnus X-1 — Black Hole Archive</span>
  </div>
  <div id="hd-right">
    <span id="hd-status">Mass <span>14.8 M☉</span> · Dist <span>6,070 LY</span></span>
    <a id="hd-back" href="/constellation.html"><img src="/assets/lucid/Left-Arrow.png" alt="" class="lucid-icon" style="width:10px;height:10px;vertical-align:middle;margin-right:4px">Archive</a>
  </div>
</header>

<div class="lore-node" id="node-0" style="display:none"><div class="lore-node-ring"></div><div class="lore-node-ring2"></div><div class="lore-node-dot"></div><div class="lore-node-label">Signal Log</div></div>
<div id="lockscreen" style="display:none"></div>
<div id="lore-panel" style="display:none"></div>

<script src="/bundle.js" defer></script>
<script>
let cygnusPhase = 'galaxy';
let sceneStarted = false;

document.getElementById('galaxy-img').addEventListener('click', () => {
  if (cygnusPhase !== 'galaxy') return;
  cygnusPhase = 'warping';
  startWarpTransition();
});

function startWarpTransition() {
  const galaxyPhase = document.getElementById('galaxy-phase');
  const warpCanvas = document.getElementById('warp-canvas');
  galaxyPhase.classList.add('hidden');
  warpCanvas.style.display = 'block';
  
  const ctx = warpCanvas.getContext('2d');
  warpCanvas.width = window.innerWidth;
  warpCanvas.height = window.innerHeight;
  
  const centerX = warpCanvas.width / 2;
  const centerY = warpCanvas.height / 2;
  const maxDistance = Math.hypot(centerX, centerY);
  
  const stars = [];
  for (let i = 0; i < 150; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * maxDistance * 1.2;
    stars.push({
      x: centerX + Math.cos(angle) * dist,
      y: centerY + Math.sin(angle) * dist,
      z: Math.random(),
      size: (1 - Math.random() * 0.5) * 2,
      speed: 0.3 + Math.random() * 0.4
    });
  }
  
  let warpTime = 0;
  const warpDuration = 2000;
  
  function animateWarp() {
    warpTime += 16;
    const progress = Math.min(warpTime / warpDuration, 1);
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    stars.forEach(star => {
      const convergence = progress * 0.3;
      const x = centerX + (star.x - centerX) * (1 - convergence);
      const y = centerY + (star.y - centerY) * (1 - convergence);
      const size = star.size * (1 + progress * 3);
      const opacity = Math.max(0, 1 - progress);
      
      ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    
    const glowSize = 100 + progress * 200;
    const glowOpacity = 0.5 * (1 - progress);
    ctx.fillStyle = `rgba(255, 180, 100, ${glowOpacity})`;
    ctx.beginPath();
    ctx.arc(centerX, centerY, glowSize, 0, Math.PI * 2);
    ctx.fill();
    
    if (progress < 1) {
      requestAnimationFrame(animateWarp);
    } else {
      warpCanvas.style.display = 'none';
      cygnusPhase = 'star_system';
      document.getElementById('star-phase').classList.add('active');
      
      if (!sceneStarted) {
        startScene();
        sceneStarted = true;
        setTimeout(() => {
          if (window._startAnimationLoop) window._startAnimationLoop();
        }, 100);
      }
    }
  }
  
  animateWarp();
}

function startScene() {
  setTimeout(() => {
    document.getElementById('intro').classList.add('fade');
    setTimeout(() => { document.getElementById('intro').style.display = 'none'; }, 1500);
  }, 2000);

  if (typeof THREE === 'undefined') { setTimeout(startScene, 200); return; }

  const canvas = document.getElementById('canvas');
  if (cygnusPhase !== 'star_system') canvas.style.display = 'none';
  
  let W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(0x02020a, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, W / H, 0.01, 2000);
  camera.position.set(0, 12, 20);
  camera.lookAt(0, 0, 0);

  // Background stars
  const count = 4000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 380 + Math.random() * 220;
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
  scene.add(new THREE.Points(geo, starMat));

  // FULL BLACK HOLE SYSTEM
  const horizonGeo = new THREE.SphereGeometry(1, 48, 48);
  const horizonMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const horizon = new THREE.Mesh(horizonGeo, horizonMat);
  scene.add(horizon);

  // Event horizon glow rings
  const glow1Geo = new THREE.SphereGeometry(1.3, 48, 48);
  const glow1Mat = new THREE.MeshBasicMaterial({ color: 0xff6644, transparent: true, opacity: 0.4, depthWrite: false });
  const glow1 = new THREE.Mesh(glow1Geo, glow1Mat);
  scene.add(glow1);

  const glow2Geo = new THREE.SphereGeometry(1.6, 48, 48);
  const glow2Mat = new THREE.MeshBasicMaterial({ color: 0xff8822, transparent: true, opacity: 0.2, depthWrite: false });
  const glow2 = new THREE.Mesh(glow2Geo, glow2Mat);
  scene.add(glow2);

  // Accretion disk particles
  const diskParticles = [];
  for (let i = 0; i < 400; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 5 + Math.random() * 8;
    diskParticles.push({
      angle: angle,
      radius: radius,
      speed: 0.008 + Math.random() * 0.012,
      y: (Math.random() - 0.5) * 1.5,
      size: Math.random() * 0.15,
      color: Math.random() > 0.5 ? 0xff8844 : 0xffcc88
    });
  }

  // Photon sphere (orbiting photons)
  const photonPoints = [];
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    photonPoints.push({
      angle: angle,
      radius: 2.2,
      speed: 0.015
    });
  }

  // Relativistic jets
  const jetGeo = new THREE.ConeGeometry(0.8, 8, 16);
  const jetMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.3 });
  const jetTop = new THREE.Mesh(jetGeo, jetMat);
  jetTop.position.z = 4;
  scene.add(jetTop);
  
  const jetBottom = new THREE.Mesh(jetGeo, jetMat);
  jetBottom.position.z = -4;
  jetBottom.rotation.x = Math.PI;
  scene.add(jetBottom);

  // ORBITING PLANETS
  const planetData = [
    { name: 'Kiar-88C', distance: 13.5, angle: 0, speed: 0.006, size: 0.6, image: '/assets/Cygnus-gifs/planets/Kiar-88C.gif' },
    { name: 'Ameana', distance: 15, angle: Math.PI * 0.5, speed: 0.004, size: 0.5, image: '/assets/Cygnus-gifs/planets/Ameana.gif' },
    { name: 'Ersetu', distance: 14, angle: Math.PI, speed: 0.005, size: 0.55, image: '/assets/Cygnus-gifs/planets/Ersetu.gif' },
    { name: 'Lianas', distance: 16, angle: Math.PI * 1.5, speed: 0.0038, size: 0.45, image: '/assets/Cygnus-gifs/planets/Lianas.gif' },
    { name: 'ASTRA-383TB', distance: 14.5, angle: Math.PI * 0.25, speed: 0.0055, size: 0.52, image: '/assets/Cygnus-gifs/planets/ASTRA-383TB.gif' }
  ];

  const textureLoader = new THREE.TextureLoader();
  const planets = [];

  planetData.forEach(data => {
    const geometry = new THREE.SphereGeometry(data.size, 32, 32);
    let material = new THREE.MeshBasicMaterial({ color: 0x8888bb });
    
    textureLoader.load(data.image, (texture) => {
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      planet.material = new THREE.MeshBasicMaterial({ map: texture });
    });

    const planet = new THREE.Mesh(geometry, material);
    planet.userData = { distance: data.distance, angle: data.angle, speed: data.speed };
    scene.add(planet);
    planets.push(planet);
  });

  let spherical = { theta: 0.3, phi: 1.3, r: 14 };
  let isDragging = false, lastMouse = { x: 0, y: 0 };

  function updateCamera() {
    camera.position.x = spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    camera.position.y = spherical.r * Math.cos(spherical.phi);
    camera.position.z = spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.lookAt(0, 0, 0);
  }

  canvas.addEventListener('mousedown', (e) => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
      spherical.theta += (e.clientX - lastMouse.x) * 0.01;
      spherical.phi += (e.clientY - lastMouse.y) * 0.01;
      spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
      lastMouse = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
  });
  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    spherical.r = Math.max(5, Math.min(50, spherical.r + e.deltaY * 0.05));
    updateCamera();
  });

  function animate() {
    requestAnimationFrame(animate);

    if (cygnusPhase === 'star_system' && canvas.style.display === 'none') {
      canvas.style.display = 'block';
    }

    // Animate disk particles
    diskParticles.forEach(p => {
      p.angle += p.speed;
    });

    // Animate photon sphere
    photonPoints.forEach(pp => {
      pp.angle += pp.speed;
    });

    // Orbit planets
    planets.forEach(planet => {
      planet.userData.angle += planet.userData.speed;
      planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
      planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
      planet.position.y = Math.sin(planet.userData.angle * 0.5) * 2;
      planet.rotation.x += 0.001;
      planet.rotation.y += 0.002;
    });

    // Auto rotate if not dragging
    if (!isDragging) { spherical.theta += 0.0010; updateCamera(); }

    // Animate jets
    jetTop.material.opacity = 0.2 + Math.sin(Date.now() * 0.001) * 0.1;
    jetBottom.material.opacity = 0.2 + Math.sin(Date.now() * 0.001) * 0.1;

    // Animate glows
    glow1.rotation.z += 0.0005;
    glow2.rotation.z -= 0.0003;

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });

  window._startAnimationLoop = () => {};
}

function runSignalDecodeIntro() {
  const el = document.getElementById('signal-decode');
  const textEl = document.getElementById('sd-text');
  el.classList.add('show');

  const fullText = '"They lied to us. Send help. Any way possible. No matter who is out there."';
  let i = 0;
  const delay = 42;

  setTimeout(() => {
    const interval = setInterval(() => {
      textEl.textContent = fullText.slice(0, i);
      i++;
      if (i > fullText.length) {
        clearInterval(interval);
        document.getElementById('sd-source').classList.add('show');
        setTimeout(() => {
          el.classList.remove('show');
          el.classList.add('fade');
          setTimeout(() => {
            el.style.display = 'none';
            startScene();
          }, 700);
        }, 2800);
      }
    }, delay);
  }, 600);
}

function checkLock() {
  try {
    const solved = JSON.parse(localStorage.getItem('wncore-constellation-solved') || '[]');
    if (solved.length >= 20) {
      runSignalDecodeIntro();
      return true;
    }
  } catch(e) {}
  return false;
}

checkLock();
</script>
<script src="/font-glitch.js" defer></script>
</body>
