<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KL883B — Planetary System Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --alien-bg: #0a0a0f;
  --alien-text: #8ab4d4;
  --alien-dim: #3a5a74;
  --alien-bright: #c4e0f4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--alien-bg);
  font-family: 'IBM Plex Mono', monospace;
  color: var(--alien-text);
}

#canvas { position: fixed; inset: 0; display: block; }

#system-header {
  position: fixed;
  top: 30px;
  left: 30px;
  z-index: 20;
  pointer-events: none;
}

.header-line {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--alien-dim);
  margin-bottom: 6px;
  opacity: 0.7;
}

.header-status {
  font-size: 0.7rem;
  letter-spacing: 3px;
  color: #ff6644;
  animation: status-pulse 1.5s ease-in-out infinite;
  font-weight: bold;
}

@keyframes status-pulse {
  0%, 100% { opacity: 0.5; text-shadow: 0 0 10px rgba(255,100,68,0.2); }
  50% { opacity: 1; text-shadow: 0 0 20px rgba(255,100,68,0.6); }
}

#info-panel {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 420px;
  max-height: 340px;
  background: rgba(10,14,26,0.96);
  border: 1px solid rgba(138,180,212,0.2);
  backdrop-filter: blur(10px);
  border-radius: 3px;
  padding: 22px;
  z-index: 25;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

#info-panel.active {
  opacity: 1;
  pointer-events: all;
}

.info-title {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--alien-bright);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.info-tag {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--alien-dim);
  margin-bottom: 16px;
  text-transform: uppercase;
}

.info-section {
  margin-bottom: 16px;
  font-size: 11px;
  line-height: 1.7;
}

.info-section-title {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--alien-dim);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.info-body {
  border-left: 1px solid rgba(138,180,212,0.15);
  padding-left: 10px;
  color: var(--alien-text);
}

#close-panel {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 24px;
  height: 24px;
  background: none;
  border: none;
  color: var(--alien-dim);
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
  transition: color 0.2s;
}

#close-panel:hover {
  color: var(--alien-bright);
}

#controls-hint {
  position: fixed;
  bottom: 30px;
  right: 30px;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--alien-dim);
  text-align: right;
  pointer-events: none;
  z-index: 20;
  line-height: 1.6;
}

#vanish-indicator {
  position: fixed;
  top: 30px;
  right: 30px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #ff6644;
  text-transform: uppercase;
  animation: vanish-flicker 0.8s ease-in-out infinite;
  z-index: 20;
}

@keyframes vanish-flicker {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: rgba(138,180,212,0.05); }
::-webkit-scrollbar-thumb { background: rgba(138,180,212,0.2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(138,180,212,0.4); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="system-header">
  <div class="header-line">KL883B System Archive</div>
  <div class="header-status">⊘ OBSERVATION LOST</div>
</div>

<div id="vanish-indicator">
  [SYSTEM VANISHED]
</div>

<div id="info-panel">
  <button id="close-panel">✕</button>
  <div class="info-title" id="info-title">KAGE</div>
  <div class="info-tag" id="info-tag">Fourth circle · the origin</div>
  <div class="info-section">
    <div class="info-section-title">Human Record</div>
    <div class="info-body" id="info-human"></div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Observation</div>
    <div class="info-body" id="info-alien"></div>
  </div>
</div>

<div id="controls-hint">
  DRAG: rotate<br>
  SCROLL: zoom<br>
  CLICK: info
</div>

<script>
function checkLegacyLock() {
  try {
    const solved = JSON.parse(localStorage.getItem('wncore-constellation-solved') || '[]');
    if (solved.length < 20) {
      document.body.innerHTML = `
        <style>
          body { background: #000; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; }
          .lock { text-align: center; max-width: 600px; color: #8ab4d4; }
          .lock-title { font-size: 2rem; letter-spacing: 3px; margin: 30px 0; text-transform: uppercase; }
          .lock-body { font-size: 12px; line-height: 1.8; margin: 20px 0; opacity: 0.7; }
          .lock-progress { margin: 30px 0; font-size: 11px; }
          .bar { width: 200px; height: 2px; background: rgba(138,180,212,0.2); margin: 10px auto; }
          .fill { height: 100%; background: rgba(138,180,212,0.8); width: \${solved.length * 5}%; transition: width 0.3s; }
          .lock-hint { margin-top: 30px; font-size: 10px; letter-spacing: 1px; color: #ff6644; }
          a { color: #8ab4d4; text-decoration: none; border-bottom: 1px solid #8ab4d4; }
        </style>
        <div class="lock">
          <div class="lock-title">ACCESS DENIED</div>
          <div class="lock-body">
            KL883B System Archives remain sealed.<br><br>
            The star system that transmitted the signal in 2011 vanished from all known observation coordinates shortly after contact was established. Only fragmented records remain.<br><br>
            All access routes require verification.
          </div>
          <div class="lock-progress">
            Solve all 20 constellation puzzles to unlock:
            <div class="bar"><div class="fill"></div></div>
            <div>\${solved.length} / 20</div>
          </div>
          <div class="lock-hint">Return to the Signal Archive to continue solving.</div>
          <div style="margin-top: 40px;"><a href="/constellation.html">← Back to Constellation Archive</a></div>
        </div>
      `;
      return false;
    }
    return true;
  } catch(e) {
    return false;
  }
}

if (!checkLegacyLock()) {
  // Lock screen shown
} else {
  const canvas = document.getElementById('canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0a0f, 1);
  camera.position.set(0, 15, 35);
  camera.lookAt(0, 0, 0);

  // Background stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 3000;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i * 3] = (Math.random() - 0.5) * 2000;
    starPos[i * 3 + 1] = (Math.random() - 0.5) * 2000;
    starPos[i * 3 + 2] = (Math.random() - 0.5) * 2000;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, opacity: 0.6, transparent: true });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // Central star
  const starGeometry = new THREE.SphereGeometry(1.2, 32, 32);
  const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc66 });
  const centralStar = new THREE.Mesh(starGeometry, starMaterial);
  scene.add(centralStar);

  const glowGeo = new THREE.SphereGeometry(1.5, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.2, depthWrite: false });
  const starGlow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(starGlow);

  // Planet data
  const planetData = {
    drev: { name: 'Drev', tag: 'First circle · the burned one', distance: 8, size: 0.6, speed: 0.01, image: '/assets/Cygnus-gifs/planets/Drev.gif', human: 'It does not move as things should move. The face it shows the fire has not changed since the first elder looked upon it. The other face is cold beyond the word for cold.', alien: 'Tidally locked body. Extreme temperature differential between day and night sides. No explanation for observed atmospheric circulation.' },
    obsidis: { name: 'Obsidis', tag: 'Second circle · the absent one', distance: 14, size: 0.4, speed: 0.005, image: '/assets/Cygnus-gifs/planets/Obsidis.gif', human: 'We see where it is by what is not there. A hole in the sky that moves. It has two companions we have tried to name four times.', alien: 'Dark body. Minimal light reflection. Gravitational lensing effects suggest massive companion objects in unstable orbit.' },
    vael: { name: 'Vael', tag: 'Third circle · the reborn one', distance: 10, size: 0.5, speed: 0.008, image: '/assets/Cygnus-gifs/planets/Vael.gif', human: 'Each time we map it the map is wrong. There is a place at the north angle that does not change. We have stopped arguing about what this means.', alien: 'Geologically active. Consistent surface reformation. One region exhibits non-volcanic activity. Temporal anomalies detected.' },
    kage: { name: 'KAGE', tag: 'Fourth circle · the origin', distance: 12, size: 0.7, speed: 0.007, image: '/assets/Cygnus-gifs/planets/KAGE.gif', human: 'Water. More water than land. Air that a body could breathe. We do not know how we know this. The signal came from there. We do not know if it still does.', alien: 'Earth-analog classification. Biosphere signatures detected. Origin of 88.7 FM transmission confirmed. SYSTEM STATUS: OBSERVATION LOST.' },
    shurn: { name: 'Shurn', tag: 'Fifth circle · the ringed', distance: 18, size: 0.6, speed: 0.004, image: '/assets/Cygnus-gifs/planets/Shurn.gif', human: 'It moves like something is holding it up. The rings are dust and ice but they do not behave as dust and ice should.', alien: 'Ringed dwarf body. Ring composition suggests recent fragmentation event. Ring stability: anomalous.' },
    mourne: { name: 'Mourne', tag: 'Sixth circle · the deep', distance: 20, size: 0.8, speed: 0.003, image: '/assets/Cygnus-gifs/planets/Mourne.gif', human: 'We have stopped arguing about what lies beneath. We know something lives there in the darkness.', alien: 'Ice giant with subsurface ocean. Geothermal activity indicates internal heat source. Potential for chemosynthetic life.' },
    orveth: { name: 'Orveth', tag: 'Seventh circle · the magnetic', distance: 16, size: 0.6, speed: 0.005, image: '/assets/Cygnus-gifs/planets/Orveth.gif', human: 'The signal bends around it. Radio waves arrive distorted. We have never understood why it has such influence on the space around it.', alien: 'Magnetic field strength exceeds prediction models. Likely magnetar or magnetic monopole effects. Surface composition: metallic ore-rich.' },
    calyx: { name: 'Calyx', tag: 'Eighth circle · the hollow', distance: 22, size: 0.4, speed: 0.003, image: '/assets/Cygnus-gifs/planets/Calyx.gif', human: 'It weighs too little. The surface has no marks. Nothing has ever hit it. Its path around the fire is too clean to have happened by accident.', alien: 'Body classification: Hollow sphere. Mass inconsistent with size — internal structure unknown. Orbital mechanics suggest artificial origin.' },
    thresh: { name: 'Thresh', tag: 'Ninth circle · the scarred', distance: 24, size: 0.5, speed: 0.002, image: '/assets/Cygnus-gifs/planets/Thresh.gif', human: 'Every surface is broken. Not by time but by impact. Something very old crashed into many things. Or many things crashed into something very old.', alien: 'Heavily cratered body. Impact history spans billions of years. One crater exhibits signs of non-natural origin.' },
    nullen: { name: 'Nullen', tag: 'Tenth circle · the last witness', distance: 26, size: 0.3, speed: 0.002, image: '/assets/Cygnus-gifs/planets/Nullen.gif', human: 'The brightest and the furthest. When it reaches the edge, everything else goes quiet. For three days no other signal reaches us from that direction.', alien: 'High albedo body. Electromagnetic interference patterns correlate with orbital position. Origin of phenomenon unknown.' }
  };

  const textureLoader = new THREE.TextureLoader();
  const planets = [];
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  Object.entries(planetData).forEach(([key, data]) => {
    const geometry = new THREE.SphereGeometry(data.size, 32, 32);
    let material = new THREE.MeshBasicMaterial({ color: 0x666666 });
    
    textureLoader.load(data.image, (texture) => {
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      planet.material = new THREE.MeshBasicMaterial({ map: texture });
    });

    const planet = new THREE.Mesh(geometry, material);
    planet.userData = { key: key, distance: data.distance, angle: Math.random() * Math.PI * 2, speed: data.speed, data: data };
    scene.add(planet);
    planets.push(planet);

    // Orbit ring
    const orbitGeo = new THREE.BufferGeometry();
    const orbitPoints = [];
    for (let i = 0; i < 128; i++) {
      const angle = (i / 128) * Math.PI * 2;
      orbitPoints.push(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance);
    }
    orbitGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(orbitPoints), 3));
    const orbitMat = new THREE.LineBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.1 });
    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
    scene.add(orbitLine);
  });

  let isDragging = false;
  let previousMousePosition = { x: 0, y: 0 };
  let rotation = { x: 0, y: 0 };

  canvas.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    rotation.y += (e.clientX - previousMousePosition.x) * 0.005;
    rotation.x += (e.clientY - previousMousePosition.y) * 0.005;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.position.z += e.deltaY * 0.05;
    camera.position.z = Math.max(25, Math.min(80, camera.position.z));
  });

  canvas.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planets);
    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      const panel = document.getElementById('info-panel');
      document.getElementById('info-title').textContent = clicked.userData.data.name;
      document.getElementById('info-tag').textContent = clicked.userData.data.tag;
      document.getElementById('info-human').textContent = clicked.userData.data.human;
      document.getElementById('info-alien').textContent = clicked.userData.data.alien;
      panel.classList.add('active');
    }
  });

  document.getElementById('close-panel').addEventListener('click', () => {
    document.getElementById('info-panel').classList.remove('active');
  });

  function animate() {
    requestAnimationFrame(animate);
    planets.forEach(planet => {
      planet.userData.angle += planet.userData.speed;
      planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
      planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
      planet.rotation.x += 0.001;
      planet.rotation.y += 0.002;
    });

    camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation.y);
    camera.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), rotation.x);
    rotation.x *= 0.95;
    rotation.y *= 0.95;
    camera.lookAt(0, 0, 0);

    stars.material.opacity = 0.4 + Math.sin(Date.now() * 0.001) * 0.2;
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
</script>

</body>
</html>
