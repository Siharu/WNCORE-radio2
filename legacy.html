<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KL883B — Planetary System Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --alien-bg: #0a0a0f;
  --alien-text: #8ab4d4;
  --alien-dim: #3a5a74;
  --alien-bright: #c4e0f4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--alien-bg);
  font-family: 'IBM Plex Mono', monospace;
  color: var(--alien-text);
}

#canvas { position: fixed; inset: 0; display: block; }

#system-header {
  position: fixed;
  top: 30px;
  left: 30px;
  z-index: 20;
  pointer-events: none;
}

.header-line {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--alien-dim);
  margin-bottom: 6px;
  opacity: 0.7;
}

.header-status {
  font-size: 0.7rem;
  letter-spacing: 3px;
  color: #ff6644;
  animation: status-pulse 1.5s ease-in-out infinite;
  font-weight: bold;
}

@keyframes status-pulse {
  0%, 100% { opacity: 0.5; text-shadow: 0 0 10px rgba(255,100,68,0.2); }
  50% { opacity: 1; text-shadow: 0 0 20px rgba(255,100,68,0.6); }
}

#info-panel {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 420px;
  max-height: 380px;
  background: rgba(10,14,26,0.97);
  border: 1px solid rgba(138,180,212,0.25);
  backdrop-filter: blur(12px);
  border-radius: 2px;
  padding: 24px;
  z-index: 25;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  box-shadow: 0 0 30px rgba(10,14,26,0.6), inset 0 0 1px rgba(138,180,212,0.1);
}

#info-panel.active {
  opacity: 1;
  pointer-events: all;
}

.info-title {
  font-size: 15px;
  letter-spacing: 2.5px;
  color: var(--alien-bright);
  margin-bottom: 6px;
  text-transform: uppercase;
  font-weight: bold;
}

.info-tag {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--alien-dim);
  margin-bottom: 16px;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(138,180,212,0.1);
  padding-bottom: 10px;
}

.info-section {
  margin-bottom: 18px;
  font-size: 11px;
  line-height: 1.75;
}

.info-section-title {
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--alien-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 600;
}

.info-body {
  border-left: 2px solid rgba(138,180,212,0.2);
  padding-left: 12px;
  color: var(--alien-text);
  line-height: 1.8;
}

#close-panel {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 24px;
  height: 24px;
  background: none;
  border: 1px solid rgba(138,180,212,0.3);
  color: var(--alien-dim);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  border-radius: 2px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

#close-panel:hover {
  color: var(--alien-bright);
  border-color: rgba(138,180,212,0.6);
  background: rgba(138,180,212,0.1);
}

#controls-hint {
  position: fixed;
  bottom: 30px;
  right: 30px;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--alien-dim);
  text-align: right;
  pointer-events: none;
  z-index: 20;
  line-height: 1.6;
}

#vanish-indicator {
  position: fixed;
  top: 30px;
  right: 30px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #ff6644;
  text-transform: uppercase;
  animation: vanish-flicker 0.8s ease-in-out infinite;
  z-index: 20;
}

@keyframes vanish-flicker {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: rgba(138,180,212,0.05); }
::-webkit-scrollbar-thumb { background: rgba(138,180,212,0.2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(138,180,212,0.4); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="system-header">
  <div class="header-line">KL883B System Archive</div>
  <div class="header-status">⊘ OBSERVATION LOST</div>
</div>

<div id="vanish-indicator">
  [SYSTEM VANISHED]
</div>

<div id="info-panel">
  <button id="close-panel">✕</button>
  <div class="info-title" id="info-title">KAGE</div>
  <div class="info-tag" id="info-tag">Fourth circle · the origin</div>
  <div class="info-section">
    <div class="info-section-title">Human Record</div>
    <div class="info-body" id="info-human"></div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Observation</div>
    <div class="info-body" id="info-alien"></div>
  </div>
</div>

<div id="controls-hint">
  DRAG: rotate<br>
  SCROLL: zoom<br>
  CLICK: info
</div>

<script>
function checkLegacyLock() {
  try {
    const solved = JSON.parse(localStorage.getItem('wncore-constellation-solved') || '[]');
    if (solved.length < 20) {
      document.body.innerHTML = `
        <style>
          body { background: #000; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; }
          .lock { text-align: center; max-width: 600px; color: #8ab4d4; }
          .lock-title { font-size: 2rem; letter-spacing: 3px; margin: 30px 0; text-transform: uppercase; }
          .lock-body { font-size: 12px; line-height: 1.8; margin: 20px 0; opacity: 0.7; }
          .lock-progress { margin: 30px 0; font-size: 11px; }
          .bar { width: 200px; height: 2px; background: rgba(138,180,212,0.2); margin: 10px auto; }
          .fill { height: 100%; background: rgba(138,180,212,0.8); width: \${solved.length * 5}%; transition: width 0.3s; }
          .lock-hint { margin-top: 30px; font-size: 10px; letter-spacing: 1px; color: #ff6644; }
          a { color: #8ab4d4; text-decoration: none; border-bottom: 1px solid #8ab4d4; }
        </style>
        <div class="lock">
          <div class="lock-title">ACCESS DENIED</div>
          <div class="lock-body">
            KL883B System Archives remain sealed.<br><br>
            The star system that transmitted the signal in 2011 vanished from all known observation coordinates shortly after contact was established. Only fragmented records remain.<br><br>
            All access routes require verification.
          </div>
          <div class="lock-progress">
            Solve all 20 constellation puzzles to unlock:
            <div class="bar"><div class="fill"></div></div>
            <div>\${solved.length} / 20</div>
          </div>
          <div class="lock-hint">Return to the Signal Archive to continue solving.</div>
          <div style="margin-top: 40px;"><a href="/constellation.html">← Back to Constellation Archive</a></div>
        </div>
      `;
      return false;
    }
    return true;
  } catch(e) {
    return false;
  }
}

if (!checkLegacyLock()) {
  // Lock shown
} else {
  const canvas = document.getElementById('canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0a0f, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  camera.position.set(0, 25, 35);
  camera.lookAt(0, 0, 0);

  /* ─────────────────────────────────────────────────
     GALAXY BACKGROUND
  ───────────────────────────────────────────────────── */
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 2048;
  canvas2d.height = 2048;
  const ctx = canvas2d.getContext('2d');
  
  // Create galaxy texture procedurally
  const imageData = ctx.createImageData(canvas2d.width, canvas2d.height);
  const data = imageData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.random() * 20;     // R
    data[i + 1] = Math.random() * 15; // G
    data[i + 2] = Math.random() * 30; // B
    data[i + 3] = 255;                // A
  }
  
  // Add nebula clouds
  for (let i = 0; i < 5000; i++) {
    const x = Math.floor(Math.random() * canvas2d.width);
    const y = Math.floor(Math.random() * canvas2d.height);
    const idx = (y * canvas2d.width + x) * 4;
    data[idx] += Math.random() * 100;
    data[idx + 1] += Math.random() * 80;
    data[idx + 2] += Math.random() * 120;
  }
  
  ctx.putImageData(imageData, 0, 0);
  const galaxyTexture = new THREE.CanvasTexture(canvas2d);
  const bgGeo = new THREE.SphereGeometry(900, 32, 32);
  const bgMat = new THREE.MeshBasicMaterial({ map: galaxyTexture, side: THREE.BackSide });
  const background = new THREE.Mesh(bgGeo, bgMat);
  scene.add(background);

  /* ─────────────────────────────────────────────────
     LIGHTING
  ───────────────────────────────────────────────────── */
  const ambientLight = new THREE.AmbientLight(0x404050, 0.8);
  scene.add(ambientLight);

  const starLight = new THREE.PointLight(0xffcc88, 2.5, 200);
  starLight.position.set(0, 0, 0);
  scene.add(starLight);

  /* ─────────────────────────────────────────────────
     CENTRAL STAR WITH GLOW
  ───────────────────────────────────────────────────── */
  const starGeo = new THREE.SphereGeometry(2, 64, 64);
  const starMat = new THREE.MeshPhongMaterial({
    color: 0xffaa44,
    emissive: 0xff8822,
    emissiveIntensity: 0.8,
    shininess: 10
  });
  const star = new THREE.Mesh(starGeo, starMat);
  scene.add(star);

  // Star glow halo
  const glowGeo = new THREE.SphereGeometry(3, 64, 64);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffaa44,
    transparent: true,
    opacity: 0.15,
    depthWrite: false
  });
  const glow1 = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glow1);

  const glow2Geo = new THREE.SphereGeometry(5, 64, 64);
  const glow2Mat = new THREE.MeshBasicMaterial({
    color: 0xff6622,
    transparent: true,
    opacity: 0.08,
    depthWrite: false
  });
  const glow2 = new THREE.Mesh(glow2Geo, glow2Mat);
  scene.add(glow2);

  /* ─────────────────────────────────────────────────
     PLANET DATA WITH CODEX
  ───────────────────────────────────────────────────── */
  const planetData = {
    drev: { name: 'Drev', tag: 'First circle · the burned one', distance: 8, size: 0.6, speed: 0.01, yOffset: -1.5, color: 0xaa5533, image: '/assets/Cygnus-gifs/planets/Drev.gif', human: 'It does not move as things should move. The face it shows the fire has not changed since the first elder looked upon it. The other face is cold beyond the word for cold. Between them, a ridge that hums. We do not go to the ridge.', alien: 'Tidally locked body. Extreme temperature differential between day and night sides. No explanation for observed atmospheric circulation.' },
    obsidis: { name: 'Obsidis', tag: 'Second circle · the absent one', distance: 14, size: 0.4, speed: 0.005, yOffset: 1.2, color: 0x222233, image: '/assets/Cygnus-gifs/planets/Obsidis.gif', human: 'We see where it is by what is not there. A hole in the sky that moves. The instruments that watch it send back only warmth. No light. It is there. We know it is there. It has two companions we have tried to name four times. The names do not stay written.', alien: 'Dark body. Minimal light reflection. Gravitational lensing effects suggest massive companion objects in unstable orbit.' },
    vael: { name: 'Vael', tag: 'Third circle · the reborn one', distance: 10, size: 0.5, speed: 0.008, yOffset: -0.8, color: 0xff9944, image: '/assets/Cygnus-gifs/planets/Vael.gif', human: 'Each time we map it the map is wrong. This is not error. It is always being made new. There is a place at the north angle that does not change. We have argued for generations about what this means. We do not agree. We have stopped arguing.', alien: 'Geologically active. Consistent surface reformation. One region exhibits non-volcanic activity. Temporal anomalies detected.' },
    kage: { name: 'KAGE', tag: 'Fourth circle · the origin', distance: 12, size: 0.7, speed: 0.007, yOffset: 1.0, color: 0x4488cc, image: '/assets/Cygnus-gifs/planets/KAGE.gif', human: 'Water. More water than land. Air that a body could breathe. We do not know how we know this. No instrument we have built should reach that far. The signal came from there. We were not surprised. We had always believed something lived there. We do not know if it still does.', alien: 'Earth-analog classification. Biosphere signatures detected. Origin of 88.7 FM transmission confirmed. SYSTEM STATUS: OBSERVATION LOST.' },
    shurn: { name: 'Shurn', tag: 'Fifth circle · the ringed', distance: 18, size: 0.6, speed: 0.004, yOffset: -1.8, color: 0xccaa66, image: '/assets/Cygnus-gifs/planets/Shurn.gif', human: 'It moves like something is holding it up. The rings are dust and ice but they do not behave as dust and ice should.', alien: 'Ringed dwarf body. Ring composition suggests recent fragmentation event. Ring stability: anomalous.' },
    mourne: { name: 'Mourne', tag: 'Sixth circle · the deep', distance: 20, size: 0.8, speed: 0.003, yOffset: 1.5, color: 0x4466bb, image: '/assets/Cygnus-gifs/planets/Mourne.gif', human: 'We have stopped arguing about what lies beneath. We know something lives there in the darkness.', alien: 'Ice giant with subsurface ocean. Geothermal activity indicates internal heat source. Potential for chemosynthetic life.' },
    orveth: { name: 'Orveth', tag: 'Seventh circle · the magnetic', distance: 16, size: 0.6, speed: 0.005, yOffset: -1.2, color: 0xff8844, image: '/assets/Cygnus-gifs/planets/Orveth.gif', human: 'The signal bends around it. Radio waves arrive distorted. We have never understood why it has such influence on the space around it.', alien: 'Magnetic field strength exceeds prediction models. Likely magnetar or magnetic monopole effects. Surface composition: metallic ore-rich.' },
    calyx: { name: 'Calyx', tag: 'Eighth circle · the hollow', distance: 22, size: 0.4, speed: 0.003, yOffset: 0.9, color: 0xdddddd, image: '/assets/Cygnus-gifs/planets/Calyx.gif', human: 'It weighs too little. A thing that size should weigh more. We dropped the calculation and redid it eight times. We got the same answer. The surface has no marks. Nothing has ever hit it. Nothing has ever happened to it. Its path around the fire is too clean to have happened by accident.', alien: 'Body classification: Hollow sphere. Mass inconsistent with size — internal structure unknown. Orbital mechanics suggest artificial origin or extreme age.' },
    thresh: { name: 'Thresh', tag: 'Ninth circle · the scarred', distance: 24, size: 0.5, speed: 0.002, yOffset: -1.6, color: 0x888888, image: '/assets/Cygnus-gifs/planets/Thresh.gif', human: 'Every surface is broken. Not by time but by impact. Something very old crashed into many things. Or many things crashed into something very old.', alien: 'Heavily cratered body. Impact history spans billions of years. One crater exhibits signs of non-natural origin.' },
    nullen: { name: 'Nullen', tag: 'Tenth circle · the last witness', distance: 26, size: 0.3, speed: 0.002, yOffset: 1.3, color: 0xffffcc, image: '/assets/Cygnus-gifs/planets/Nullen.gif', human: 'The brightest and the furthest. When it reaches the edge, everything else goes quiet. Not blocked. Not absorbed. Quiet. For three days no other signal reaches us from that direction. Then it returns and everything resumes. We have been waiting eighteen years for someone to explain this. No one has.', alien: 'High albedo body. Electromagnetic interference patterns correlate with orbital position. Origin of phenomenon unknown.' }
  };

  const textureLoader = new THREE.TextureLoader();
  const planets = [];
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  Object.entries(planetData).forEach(([key, data]) => {
    const geometry = new THREE.SphereGeometry(data.size, 48, 48);
    const material = new THREE.MeshPhongMaterial({
      color: data.color,
      emissive: new THREE.Color(data.color).multiplyScalar(0.3),
      shininess: 20,
      wireframe: false
    });
    
    textureLoader.load(data.image, (texture) => {
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      planet.material.map = texture;
      planet.material.needsUpdate = true;
    });

    const planet = new THREE.Mesh(geometry, material);
    
    const inclination = (Math.random() - 0.5) * 0.4;
    const initialAngle = Math.random() * Math.PI * 2;
    const eccentricity = Math.random() * 0.15;
    
    planet.userData = {
      key: key,
      distance: data.distance,
      angle: initialAngle,
      speed: data.speed,
      inclination: inclination,
      eccentricity: eccentricity,
      data: data
    };
    
    scene.add(planet);
    planets.push(planet);

    // Orbit ring with glow
    const orbitGeo = new THREE.BufferGeometry();
    const orbitPoints = [];
    for (let i = 0; i < 256; i++) {
      const angle = (i / 256) * Math.PI * 2;
      const currentDistance = data.distance * (1 - eccentricity * 0.5 + eccentricity * 0.5 * Math.cos(angle));
      const x = Math.cos(angle) * currentDistance;
      const z = Math.sin(angle) * currentDistance;
      const y = Math.sin(angle) * inclination * data.distance * 0.4;
      orbitPoints.push(x, y, z);
    }
    orbitGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(orbitPoints), 3));
    const orbitMat = new THREE.LineBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.25, linewidth: 2 });
    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
    scene.add(orbitLine);
  });

  let isDragging = false;
  let previousMousePosition = { x: 0, y: 0 };
  let rotation = { x: 0, y: 0 };

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    rotation.y += (e.clientX - previousMousePosition.x) * 0.005;
    rotation.x += (e.clientY - previousMousePosition.y) * 0.005;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener('mouseup', () => {
    isDragging = false;
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.position.z += e.deltaY * 0.05;
    camera.position.z = Math.max(20, Math.min(100, camera.position.z));
  });

  canvas.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planets);
    
    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      const data = clicked.userData.data;
      const panel = document.getElementById('info-panel');
      document.getElementById('info-title').textContent = data.name;
      document.getElementById('info-tag').textContent = data.tag;
      document.getElementById('info-human').textContent = data.human;
      document.getElementById('info-alien').textContent = data.alien;
      panel.classList.add('active');
    }
  });

  document.getElementById('close-panel').addEventListener('click', () => {
    document.getElementById('info-panel').classList.remove('active');
  });

  function animate() {
    requestAnimationFrame(animate);

    // Orbit planets
    planets.forEach(planet => {
      planet.userData.angle += planet.userData.speed;
      planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
      planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
      planet.position.y = planet.userData.data.yOffset + Math.sin(planet.userData.angle * 0.5) * (planet.userData.distance * 0.15);
      planet.rotation.x += 0.0005;
      planet.rotation.y += 0.001;
    });

    // Camera rotation
    camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation.y);
    camera.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), rotation.x);
    rotation.x *= 0.95;
    rotation.y *= 0.95;
    camera.lookAt(0, 0, 0);

    // Animate star glow
    glow1.rotation.z += 0.0005;
    glow2.rotation.z -= 0.0003;

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
</script>

</body>
</html>
