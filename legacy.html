  drev: { name: 'DREV', human: 'It does not move as things should move. The face it shows the fire has not changed since the first elder looked upon it. The other face is cold beyond the word for cold.', alien: 'Tidally locked body. Extreme temperature differential between day and night sides. No explanation for observed atmospheric circulation.', tag: 'First circle · the burned one' },
  kage: { name: 'KAGE', human: 'Water. More water than land. Air that a body could breathe. We do not know how we know this. The signal came from there.', alien: 'Earth-analog classification. Biosphere signatures detected. Origin of 88.7 FM transmission confirmed.', tag: 'Fourth circle · the origin' },
  mourne: { name: 'MOURNE', human: 'We have stopped arguing about what lies beneath. We know something lives there in the darkness.', alien: 'Ice giant with subsurface ocean. Geothermal activity indicates internal heat source. Potential for chemosynthetic life.', tag: 'Sixth circle · the deep' },
  nullen: { name: 'NULLEN', human: 'When it reaches the edge, everything else goes quiet. For three days no other signal reaches us from that direction. Then it returns and everything resumes.', alien: 'High albedo body. Electromagnetic interference patterns correlate with orbital position. Origin of phenomenon unknown.', tag: 'Tenth circle · the last witness' },
  obsidis: { name: 'OBSIDIS', human: 'We see where it is by what is not there. A hole in the sky that moves. It has two companions we have tried to name four times. The names do not stay written.', alien: 'Dark body. Minimal light reflection. Gravitational lensing effects suggest massive companion objects in unstable orbit.', tag: 'Second circle · the absent one' },
  orveth: { name: 'ORVETH', human: 'The signal bends around it. Radio waves arrive distorted. We have never understood why it has such influence on the space around it.', alien: 'Magnetic field strength exceeds prediction models. Likely magnetar or magnetic monopole effects. Surface composition: metallic ore-rich.', tag: 'Seventh circle · the magnetic' },
  shurn: { name: 'SHURN', human: 'It moves like something is holding it up. The rings are dust and ice but they do not behave as dust and ice should.', alien: 'Ringed dwarf body. Ring composition suggests recent fragmentation event. Ring stability: anomalous.', tag: 'Fifth circle · the ringed' },
  thresh: { name: 'THRESH', human: 'Every surface is broken. Not by time but by impact. Something very old crashed into many things. Or many things crashed into something very old.', alien: 'Heavily cratered body. Impact history spans billions of years. One crater exhibits signs of non-natural origin.', tag: 'Ninth circle · the scarred' },
  vael: { name: 'VAEL', human: 'Each time we map it the map is wrong. There is a place at the north angle that does not change. We have stopped arguing about what this means.', alien: 'Geologically active. Consistent surface reformation. One region exhibits non-volcanic activity. Temporal anomalies detected.', tag: 'Third circle · the reborn' }
};

const sidebarContent = document.getElementById('sidebar-content');
Object.keys(loreData).forEach(key => {
  const lore = loreData[key];
  const entry = document.createElement('div');
  entry.className = 'lore-entry';
  entry.innerHTML = `<div class="lore-entry-name">${lore.name}</div><div class="lore-entry-tag">${lore.tag}</div><div class="lore-entry-text"><strong>Human record:</strong></div><div class="human-lore"><div class="human-lore-text">${lore.human}</div></div><div class="lore-entry-text" style="margin-top:12px"><strong>Alien observation:</strong></div><div class="lore-entry-text" style="margin-top:6px">${lore.alien}</div>`;
  sidebarContent.appendChild(entry);
});

document.querySelectorAll('.planet-gif').forEach(planet => {
  planet.addEventListener('click', (e) => {
    e.stopPropagation();
    const planetName = planet.dataset.planet;
    const lore = loreData[planetName];
    if (lore) {
      loreSidebar.classList.add('open');
      sidebarOverlay.classList.add('visible');
      const entries = sidebarContent.querySelectorAll('.lore-entry');
      const index = Object.keys(loreData).indexOf(planetName);
      if (entries[index]) entries[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
});
</script>
